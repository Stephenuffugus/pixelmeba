apply plugin: 'com.android.application'

// The version has ONE source, package.json "version" (docs/ANDROID_SETUP.md §7, P4.12):
// versionName = that semantic version, versionCode = major*10000 + minor*100 + patch (1.0.0 -> 10000).
def appPackageJson = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def appVersionMatch = (appPackageJson.version as String) =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!appVersionMatch.matches()) {
    throw new GradleException("package.json version '${appPackageJson.version}' is not major.minor.patch (docs/ANDROID_SETUP.md §7)")
}
def appVersionParts = [appVersionMatch.group(1), appVersionMatch.group(2), appVersionMatch.group(3)].collect { Integer.parseInt(it) }
if (appVersionParts[1] > 99 || appVersionParts[2] > 99) {
    throw new GradleException("package.json version ${appPackageJson.version}: minor and patch must be 0-99 for versionCode = major*10000 + minor*100 + patch (docs/ANDROID_SETUP.md §7)")
}
def appVersionName = appPackageJson.version as String
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

// Release signing (docs/ANDROID_SETUP.md). The owner keeps android/keystore.properties and the
// upload keystore outside version control (both are gitignored). Without keystore.properties,
// release builds are produced unsigned and debug builds are unaffected.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}

android {
    namespace = "com.lucidwinds.pixelmeba"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lucidwinds.pixelmeba"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                if (!keystoreProperties['storeFile']) {
                    throw new GradleException("android/keystore.properties exists but has no storeFile entry (see docs/ANDROID_SETUP.md §6)")
                }
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
